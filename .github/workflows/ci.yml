name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend unit checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/backend
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harborstone_test
      PUBLIC_APP_URL: http://127.0.0.1:5173
      PUBLIC_BACKEND_URL: http://127.0.0.1:4000
      ADMIN_EMAIL: admin@harborstone.test
      ADMIN_PASSWORD: safe-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run build
      - run: npm test

  backend-integration:
    name: Backend disposable database integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: harborstone_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d harborstone_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harborstone_test
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/harborstone_test
      PUBLIC_APP_URL: http://127.0.0.1:5173
      PUBLIC_BACKEND_URL: http://127.0.0.1:4000
      SMTP_HOST: smtp.test
      SMTP_PORT: 2525
      SMTP_USER: smtp-user
      SMTP_PASSWORD: smtp-password
      ADMIN_EMAIL: admin@harborstone.test
      ADMIN_PASSWORD: safe-test-password
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/backend/package-lock.json
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/frontend/my-react-app
    env:
      VITE_GRAPHQL_URL: http://127.0.0.1:4000/graphql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/frontend/my-react-app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build

  playwright:
    name: Playwright mocked journeys
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Code/frontend/my-react-app
    env:
      CI: true
      VITE_GRAPHQL_URL: http://127.0.0.1:4000/graphql
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Code/frontend/my-react-app/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
