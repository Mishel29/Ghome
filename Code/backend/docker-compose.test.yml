services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: harborstone_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d harborstone_test"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "127.0.0.1:5434:5432"

  backend:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/harborstone_test
      PUBLIC_APP_URL: http://127.0.0.1:5175
      PUBLIC_BACKEND_URL: http://127.0.0.1:4100
      SMTP_HOST: smtp.invalid
      SMTP_PORT: "2525"
      SMTP_USER: test-user
      SMTP_PASSWORD: test-password
      MAIL_FROM_EMAIL: test@harborstone.test
      MAIL_FROM_NAME: Harborstone Homes
      ADMIN_EMAIL: admin@harborstone.test
      ADMIN_PASSWORD: test-admin-password
      NODE_ENV: test
      PORT: "4000"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:4100:4000"
